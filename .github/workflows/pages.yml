name: Pages build and deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSDK_VERSION: 4.0.10

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out PoB2 (pinned, calc files and specs)
        run: scripts/checkout-pob2.sh --specs

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Decoder/model tests (build-model, build-edit, extracted-data freshness)
        run: |
          npm run test:model
          npm run test:edit
          node --test test/data-fresh.test.mjs
          node --test test/affix-tiers.test.mjs
          node --test test/modrange.test.mjs
          node --test test/gem-data.test.mjs

      # emsdk pinned by tag (scripts/install-emsdk.sh): no `emsdk update`, which fetches an unpinned archive of
      # emsdk HEAD from github.com and failed a run with a 504.
      - uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ runner.os }}

      - name: Install emsdk ${{ env.EMSDK_VERSION }}
        run: scripts/install-emsdk.sh "$EMSDK_VERSION" "$HOME/emsdk"

      - name: Build native host and wasm engine
        run: native/build.sh all

      - name: Patch spec (compound assignment, 5.1 gsub, LuaJIT %d, host modules)
        run: build/native/pobcalc test/lua/compound_spec.lua

      - name: PoB2's own spec suite on PUC Lua 5.2 (expected values written against LuaJIT)
        run: scripts/pob-specs.sh

      - name: Parity, repo files (snapshot + every skill group)
        run: node --test test/parity.test.mjs

      - name: Pack (compile check of every bundled Lua file)
        run: node scripts/pack.mjs | tee pack-report.txt

      - name: Parity, shipped packs
        run: PARITY_SOURCE=dist PARITY_GROUPS=0 node --test test/parity.test.mjs

      - name: End to end in Chromium
        run: |
          npx playwright install --with-deps chromium
          E2E_SCREENSHOT=e2e-screenshot.png node --test test/e2e.test.mjs

      - name: Job summary
        if: always()
        run: node scripts/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            parity-diff.json
            parity-timings.json
            e2e-timings.json
            e2e-screenshot.png
            pack-report.txt
            dist/manifest.json
          if-no-files-found: ignore

      - name: Release tarball (runtime files, reproducible)
        run: scripts/release-tarball.sh dist release

      - uses: actions/upload-artifact@v4
        with:
          name: pob-calc-release
          path: release/
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # A tag (vX.Y.Z-N, X.Y.Z = PoB2 version) publishes the tarball that upgraded-disco-companion pins by sha256.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pob-calc-release
          path: release
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A release published from the web UI (which creates the tag) already exists: attach the files to it.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file <(cd release && echo "sha256:" && cat *.sha256)
          fi

  # Only main deploys: the github-pages environment rejects other branches before any step runs.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # The same e2e test against the deployed URL: catches a site that deployed but doesn't load or calculate.
  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: End to end against ${{ needs.deploy.outputs.page_url }}
        env:
          E2E_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          npx playwright install --with-deps chromium
          node --test test/e2e.test.mjs
